[tool.poetry]
name = "aqua-fouling"
version = "0.1.0"
description = "Assessment software for reverse-osmosis membrane fouling early-warning forecasts (synthetic validation)."
authors = ["AquaFoulingRO"]
readme = "README.md"
packages = [{ include = "aqua_fouling", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
pandas = "^2.2.0"
numpy = "^2.1.0"
typer = "^0.15.0"
click = ">=8.1.7,<8.2"
pyyaml = "^6.0.0"
python-multipart = "^0.0.12"
matplotlib = "^3.9.0"
scipy = ">=1.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pandas-stubs = "^2.2.0"
types-pyyaml = "^6.0.12.20260906"

[tool.poetry.scripts]
aqua = "aqua_fouling.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP038"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["aqua_fouling"]

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
