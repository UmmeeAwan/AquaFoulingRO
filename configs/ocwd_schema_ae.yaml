# Orange County RO — schema A–E (128 CSV columns incl. exported index)
name: ocwd_schema_ae
schema_id: ae_128
source_series_pattern: "^[A-E][0-9]{2}$"
index_column: "Unnamed: 0"
timestamp:
  column: date
  format: ISO8601
  timezone: America/Los_Angeles
notes: >
  Stage analysis selects stage-3 columns from each file.
  Filename/stage semantics are unresolved; source_series_id is preserved.
  No conductivity→TDS coefficient. Source-calculated fields kept distinct.

fields:
  - external_name: date
    canonical_name: observation_date_calendar
    unit: { symbol: calendar_date }
    kind: measured
    measurement_scope: whole_unit
    confidence: documented

  - external_name: temp_c
    canonical_name: temperature_c
    unit: { symbol: deg_C }
    kind: measured
    measurement_scope: whole_unit
    confidence: inferred
    notes: Direct naming evidence (_c → Celsius).

  - external_name: feed_psi
    canonical_name: feed_pressure_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: whole_unit
    confidence: inferred
    notes: Direct naming evidence (_psi). Whole-unit; not mixed into stage-3 NDP.

  - external_name: perm_psi
    canonical_name: permeate_pressure_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: whole_unit
    confidence: inferred
    notes: Whole-unit permeate pressure; stage-3 path prefers perm_press_stage_1 only if scoped — see stage fields.

  - external_name: stage_2_3_press
    canonical_name: stage_3_feed_pressure_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: stage_3
    confidence: inferred
    notes: >
      ASSUMPTION (inferred): treated as hydraulic pressure entering stage 3.
      Confirm against P&ID / diagrams before relying on independent NDP.

  - external_name: perm_press_stage_1
    canonical_name: stage_1_permeate_pressure_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: stage_1
    confidence: inferred

  - external_name: stage_2_3_feed_flow
    canonical_name: stage_3_feed_flow_source_unit
    unit: { symbol: unresolved_flow }
    kind: measured
    measurement_scope: stage_3
    confidence: unresolved
    notes: Candidate stage-3 feed flow for recovery; unit unresolved.

  - external_name: stage_3_flow
    canonical_name: stage_3_permeate_flow_source_unit
    unit: { symbol: unresolved_flow }
    kind: measured
    measurement_scope: stage_3
    confidence: unresolved

  - external_name: stage_3_flux
    canonical_name: stage_3_flux_source_unit
    unit: { symbol: unresolved_flux }
    kind: derived
    measurement_scope: stage_3
    confidence: unresolved
    notes: Source-calculated or historian-derived; unit unresolved in Rd.

  - external_name: stage_3_net_driving_press
    canonical_name: stage_3_ndp_source_calculated
    unit: { symbol: unresolved_pressure }
    kind: derived
    measurement_scope: stage_3
    confidence: unresolved
    notes: SOURCE-CALCULATED NDP — not our physics module output.

  - external_name: s3sf
    canonical_name: stage_3_specific_flux_source_calculated
    unit: { symbol: unresolved_specific_flux }
    kind: derived
    measurement_scope: stage_3
    confidence: unresolved
    notes: SOURCE-CALCULATED specific flux — distinct from independent normalisation.

  - external_name: tcf_water
    canonical_name: tcf_water_source_calculated
    unit: { symbol: "1" }
    kind: derived
    measurement_scope: whole_unit
    confidence: inferred
    notes: >
      Dimensionless by naming. Convention/equation unknown — do NOT treat as
      filmtec_exponential_tcf_v1 and do not double-correct.

  - external_name: perm_ec
    canonical_name: permeate_conductivity_source_unit
    unit: { symbol: unresolved_conductivity }
    kind: measured
    measurement_scope: whole_unit
    confidence: unresolved
    notes: Conductivity is not TDS. No silent conversion.

  - external_name: perm_ec_stage_3
    canonical_name: stage_3_permeate_conductivity_source_unit
    unit: { symbol: unresolved_conductivity }
    kind: measured
    measurement_scope: stage_3
    confidence: unresolved

  - external_name: rof_toc_avg
    canonical_name: ro_feed_toc_avg_mg_per_L
    unit: { symbol: mg_per_L }
    kind: measured
    measurement_scope: whole_unit
    confidence: documented
    notes: Rd documents mg/L.

  - external_name: cip
    canonical_name: cip_flag_0_1
    unit: { symbol: flag_0_1 }
    kind: measured
    measurement_scope: whole_unit
    confidence: documented

  - external_name: dss
    canonical_name: days_since_cleaning_d
    unit: { symbol: d }
    kind: derived
    measurement_scope: whole_unit
    confidence: documented
    notes: dss=0 is not proof of a clean reference.

  - external_name: days_since_replacement
    canonical_name: days_since_replacement_d
    unit: { symbol: d }
    kind: derived
    measurement_scope: whole_unit
    confidence: documented

  - external_name: x3rd_pass_dp
    canonical_name: stage_3_device_pressure_drop_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: stage_3
    confidence: inferred
    notes: Naming suggests differential pressure; unit inferred as psi from plant convention.

  - external_name: pf
    canonical_name: unit_permeate_flow_source_unit
    unit: { symbol: unresolved_flow }
    kind: measured
    measurement_scope: whole_unit
    confidence: unresolved

  - external_name: ff
    canonical_name: unit_feed_flow_source_unit
    unit: { symbol: unresolved_flow }
    kind: measured
    measurement_scope: whole_unit
    confidence: unresolved
