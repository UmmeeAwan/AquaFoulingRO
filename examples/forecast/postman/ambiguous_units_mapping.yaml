# Completed assisted mapping for examples/forecast/postman/ambiguous_units.csv.
# permeate_flow unit is gpd: this fixture is demo_history.csv with column
# permeate_flow_gpd renamed to permeate_flow (unit token from the source header,
# not from numeric magnitude). Confirmed optional CIP mapping is preserved.
name: assisted_mapping_v1
schema_id: assisted_mapping_v1
source_series_pattern: ".+"
timestamp:
  column: observation_date
  format: ISO8601
  timezone: UTC
notes: >
  Completed mapping for ambiguous_units.csv. permeate_flow → gpd from the
  source column name permeate_flow_gpd. Optional cip field retained.
fields:
  - external_name: observation_date
    canonical_name: observation_date_calendar
    unit: { symbol: calendar_date }
    kind: measured
    measurement_scope: whole_unit
    confidence: high
  - external_name: temperature_c
    canonical_name: temperature_c
    unit: { symbol: deg_C }
    kind: measured
    measurement_scope: whole_unit
    confidence: high
  - external_name: feed_pressure_psi
    canonical_name: stage_3_feed_pressure_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: stage_3
    confidence: high
  - external_name: permeate_pressure_psi
    canonical_name: permeate_pressure_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: whole_unit
    confidence: high
  - external_name: device_dp_psi
    canonical_name: stage_3_device_pressure_drop_psi
    unit: { symbol: psi }
    kind: measured
    measurement_scope: stage_3
    confidence: high
  - external_name: permeate_flow
    canonical_name: stage_3_permeate_flow_source_unit
    unit: { symbol: gpd }
    kind: measured
    measurement_scope: stage_3
    confidence: high
  - external_name: feed_flow_gpd
    canonical_name: stage_3_feed_flow_source_unit
    unit: { symbol: gpd }
    kind: measured
    measurement_scope: stage_3
    confidence: high
  - external_name: feed_concentration_mg_l
    canonical_name: feed_concentration_mg_l
    unit: { symbol: mg_L_NaCl_eq }
    kind: measured
    measurement_scope: whole_unit
    confidence: high
  - external_name: cip
    canonical_name: cip_flag_0_1
    unit: { symbol: flag_0_1 }
    kind: measured
    measurement_scope: whole_unit
    confidence: high
